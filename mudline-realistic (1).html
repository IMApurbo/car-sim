<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mudline: infinite roads, forests, mud and autopilot</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1611;--ink:#f1e3c8;--accent:#e8a33d;--mud:#7a4d26;--panel:rgba(29,22,17,.78);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1611;--ink:#f1e3c8;--accent:#e8a33d;--mud:#7a4d26;--panel:rgba(29,22,17,.78)}}
:root[data-theme="dark"]{--bg:#1d1611;--ink:#f1e3c8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block}
.hud{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--panel);padding:10px 14px;border-radius:6px;min-width:190px;font-size:18px;line-height:1.35}
.hud b{font-size:44px;font-weight:700;color:var(--accent);line-height:1}
.hud small{opacity:.75;font-size:15px}
.bar{height:8px;background:#0006;border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:var(--mud)}
#msg{color:var(--accent);min-height:22px}
.help{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--panel);padding:10px 14px;border-radius:6px;font-size:16px;max-width:230px;transition:opacity .6s}
#pad{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;padding:0 14px}
#pad div{display:grid;grid-template-columns:repeat(2,64px);gap:8px}
#pad button{height:64px;border:0;border-radius:8px;background:var(--panel);color:var(--ink);font:700 22px "Barlow Condensed",sans-serif}
@media (pointer:coarse){#pad{display:flex}.help{display:none}}
</style>
</head>
<body>
<div class="hud">
  <b id="spd">0</b> <small>km/h</small>
  <div class="bar"><i id="mud"></i></div>
  <div id="msg"></div>
  <small id="dif">Diff lock off</small><br>
  <small id="auto">Autopilot off (P)</small><br>
  <small id="pos"></small><br>
  <small id="mem"></small>
</div>
<div class="help" id="help">W/S throttle and reverse · A/D steer · Shift diff lock · Space brake · P autopilot · R reset · click to lock mouse &amp; look around · Esc releases · M sound</div>
<div id="lockhint" style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);padding:8px 16px;border-radius:6px;font-size:18px;pointer-events:none">Click to lock mouse for camera · Esc to release</div>
<div id="pad">
  <div><button data-k="KeyA">◀</button><button data-k="KeyD">▶</button><button data-k="KeyP">Auto</button></div>
  <div><button data-k="ShiftLeft">Diff</button><button data-k="KeyW">Gas</button><button data-k="Space">Brake</button><button data-k="KeyS">Rev</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
// ---------- deterministic terrain ----------
function hash(x,z){var n=Math.imul(x|0,374761393)+Math.imul(z|0,668265263)|0;n=Math.imul(n^(n>>>13),1274126177);n^=n>>>16;return (n>>>0)/4294967295}
function vn(x,z){var ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz;
  var u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);
  var a=hash(ix,iz),b=hash(ix+1,iz),c=hash(ix,iz+1),d=hash(ix+1,iz+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,z,o){var s=0,a=1,f=1,t=0;for(var i=0;i<o;i++){s+=a*vn(x*f,z*f);t+=a;a*=.5;f*=2}return s/t}
// roads: two families of winding roads, exact signed distance in metres (constant width, real junctions)
var lastJ=0;
function famD(u,v,sp,sd){var k0=Math.round(u/sp),best=1e9;
  for(var k=k0-1;k<=k0+1;k++){var ph=k*1.7+sd,c=k*sp+75*Math.sin(v*.0037+ph)+32*Math.sin(v*.011+ph*1.9),
    dc=.2775*Math.cos(v*.0037+ph)+.352*Math.cos(v*.011+ph*1.9),d=(u-c)/Math.sqrt(1+dc*dc);if(Math.abs(d)<Math.abs(best))best=d}
  return Math.max(-200,Math.min(200,best))}
function roadD(x,z){var a=famD(x,z,420,0),b=famD(z,x,530,5),A=Math.abs(a),B=Math.abs(b);
  lastJ=1-sm(Math.max(A,B)/10);
  return (A<B?(a<0?-1:1):(b<0?-1:1))*Math.max(0,-3*Math.log(Math.exp(-A/3)+Math.exp(-B/3)))}
function rAt(d){return 1-sm(Math.abs(d)/12)}
function mudRaw(x,z){return Math.min(1,Math.max(0,(fbm(x*.011+200,z*.011-90,3)-.62)/.08))}
function mudD(x,z,d){return mudRaw(x,z)*(1-sm(rAt(d)*1.6))}
function HD(x,z,d){var r=rAt(d),hi=fbm(x*.004,z*.004,4)*34,lo=fbm(x*.0015,z*.0015,2)*34;
  var h=hi+fbm(x*.02+50,z*.02,3)*3*(1-r)-mudD(x,z,d)*2;return h+(lo-h)*sm(r*1.3)*.9} // roads follow the gentle low-frequency ground
function roadAt(x,z){return rAt(roadD(x,z))}
function mudAt(x,z){return mudD(x,z,roadD(x,z))}
function H(x,z){return HD(x,z,roadD(x,z))}

// ---------- scene, sky, light ----------
var scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xc7d6de,30,150);
var cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.3,400);
var ren=new THREE.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.setSize(innerWidth,innerHeight);
document.body.appendChild(ren.domElement);
ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.15;
var HQ=!matchMedia('(pointer:coarse)').matches;
ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
var hemi=new THREE.HemisphereLight(0xcfe0f0,0x4a3a2a,.7);scene.add(hemi);
var sun=new THREE.DirectionalLight(0xfff3dc,1.1);scene.add(sun);scene.add(sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(HQ?2048:1024,HQ?2048:1024);
var shc=sun.shadow.camera;shc.left=shc.bottom=-55;shc.right=shc.top=55;shc.near=10;shc.far=320;sun.shadow.bias=-.0004;sun.shadow.normalBias=.25;
addEventListener('resize',function(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
var windU={value:0};
var GL='float hh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float vz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hh(i),hh(i+vec2(1.,0.)),f.x),mix(hh(i+vec2(0.,1.)),hh(i+vec2(1.,1.)),f.x),f.y);}float fz(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*vz(p);p*=2.03;a*=.5;}return s;}';
var skyU={top:{value:new THREE.Color(0x4f86c6)},hor:{value:new THREE.Color(0xc7d6de)},sd:{value:new THREE.Vector3(.5,.6,.5)},t:windU};
var sky=new THREE.Mesh(new THREE.SphereBufferGeometry(300,24,16),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,depthTest:false,fog:false,
  vertexShader:'varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top,hor,sd;uniform float t;varying vec3 vD;'+GL+
   'void main(){vec3 d=normalize(vD);vec3 c=mix(hor,top,pow(max(d.y,0.),.5));float s=max(dot(d,normalize(sd)),0.);'+
   'c+=vec3(1.,.8,.55)*(pow(s,700.)*2.+pow(s,8.)*.25);'+
   'float cl=smoothstep(.5,.8,fz(d.xz/(d.y+.25)*1.8+vec2(t*.01,0.)))*smoothstep(0.,.25,d.y);'+
   'c=mix(c,mix(vec3(1.),hor,.3)*(.8+.2*s),cl*.8);gl_FragColor=vec4(c,1.);}'}));
sky.renderOrder=-1;sky.frustumCulled=false;scene.add(sky);
var cols={tD:new THREE.Color(0x4f86c6),tN:new THREE.Color(0x35487a),hD:new THREE.Color(0xc7d6de),hN:new THREE.Color(0xf0a86e),sD:new THREE.Color(0xfff3dc),sN:new THREE.Color(0xffa860)};
function light(now){var k=Math.pow(.5+.5*Math.sin(now/1000/45),2),a=(55-45*k)*Math.PI/180;
  skyU.top.value.copy(cols.tD).lerp(cols.tN,k);skyU.hor.value.copy(cols.hD).lerp(cols.hN,k);
  skyU.sd.value.set(.6*Math.cos(a),Math.sin(a),.8*Math.cos(a));
  scene.fog.color.copy(skyU.hor.value);sun.color.copy(cols.sD).lerp(cols.sN,k);sun.intensity=1.15-.45*k;hemi.intensity=.75-.3*k;
  spot.intensity=k*1.8;sun.target.position.set(Math.round(T.x/2)*2,Math.round(T.y/2)*2,Math.round(T.z/2)*2);sun.position.copy(skyU.sd.value).multiplyScalar(150).add(sun.target.position);sun.target.updateMatrixWorld();windU.value=now/1000;sky.position.copy(cam.position)}

// ---------- shaders: ground (grass, mud, gravel, asphalt) ----------
var terrM=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.95,metalness:0});terrM.extensions={derivatives:true};
terrM.onBeforeCompile=function(sh){
  sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nattribute vec4 rinfo;attribute float rj;varying float vJ;varying vec4 vRi;varying vec2 vW;')
    .replace('#include <begin_vertex>','#include <begin_vertex>\nvRi=rinfo;vJ=rj;vW=(modelMatrix*vec4(position,1.)).xz;');
  sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying float vJ;varying vec4 vRi;varying vec2 vW;'+GL)
    .replace('#include <color_fragment>','#include <color_fragment>\n'+
    'vec2 w=vW;float ad=abs(vRi.x);float mud=vRi.w;'+
    'vec3 g=diffuseColor.rgb*(.62+.76*fz(w*.3))*(.85+.3*vz(w*3.))*1.;'+
    ''+
    'vec3 mc=vec3(.21,.14,.085)*(.65+.7*fz(w*1.3))*1.;'+
    'g=mix(g,mc,mud);float wet=mud;'+
    'float shd=1.-smoothstep(5.,10.,ad);vec3 gr=vec3(.46,.41,.33)*(.75+.35*vz(w*3.));g=mix(g,gr,shd);'+
    'float asp=1.-smoothstep(4.4,5.,ad);vec3 ac=vec3(.17,.17,.18)*(.85+.2*vz(w*6.));'+
    'ac*=1.-.3*(1.-smoothstep(0.,.05,abs(vz(w*2.3)-.5)));'+
    'float edge=(1.-smoothstep(.05,.2,abs(ad-4.)))*asp*(1.-vJ);float dash=step(.45,fract(dot(vW,vRi.yz)*.08));'+
    'float mid=(1.-smoothstep(.05,.16,ad))*dash*(1.-vJ);'+
    'ac=mix(ac,vec3(.85),edge*.8);ac=mix(ac,vec3(.9,.7,.15),mid*.9);'+
    'g=mix(g,ac,asp);wet*=1.-asp;diffuseColor.rgb=g;')
    .replace('#include <normal_fragment_maps>','#include <normal_fragment_maps>\n'+
    'float bhg=.05*fz(w*4.)+.02*vz(w*23.);float bhm=.11*fz(w*2.2)+.03*vz(w*9.);float bhr=.03*vz(w*8.);float bha=.002*vz(w*12.);'+
    'float bh=mix(mix(mix(bhg,bhm,mud),bhr,shd),bha,asp);bh*=1.-smoothstep(8.,40.,length(vViewPosition));'+
    'vec2 dH=vec2(dFdx(bh),dFdy(bh));vec3 sX=dFdx(-vViewPosition),sY=dFdy(-vViewPosition);vec3 R1=cross(sY,normal),R2=cross(normal,sX);float fD=dot(sX,R1);fD*=(float(gl_FrontFacing)*2.-1.);'+
    'normal=normalize(abs(fD)*normal-sign(fD)*(dH.x*R1+dH.y*R2));')
    .replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\nroughnessFactor=mix(roughnessFactor,.22,wet);');
};
function windify(m,k){m.onBeforeCompile=function(sh){sh.uniforms.uT=windU;
  sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nuniform float uT;')
   .replace('#include <begin_vertex>','#include <begin_vertex>\ntransformed.x+=sin(uT*1.4+instanceMatrix[3].x*.3+instanceMatrix[3].z*.2)*'+k+'*position.y*position.y;')}}

// ---------- vegetation library: procedural leaf atlas, branching trees, palms, ferns, grasses, flowers ----------
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var I4=new THREE.Matrix4();
function merge(list){var P=[],Nn=[],C=[];
  list.forEach(function(it){var g=it.g.index?it.g.toNonIndexed():it.g.clone();g.applyMatrix4(it.m);if(!it.s)g.computeVertexNormals();
    var p=g.attributes.position,n=g.attributes.normal;
    for(var i=0;i<p.count;i++){P.push(p.getX(i),p.getY(i),p.getZ(i));Nn.push(n.getX(i),n.getY(i),n.getZ(i));var c=it.c(p.getY(i));C.push(c.r,c.g,c.b)}});
  var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(Nn,3));g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));return g}

// rocks: smooth, finely tessellated boulders
var rockM=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.92});
function mkRock(sd){var g=new THREE.IcosahedronBufferGeometry(1,4),p=g.attributes.position,nm=new Float32Array(p.count*3);
  for(var i=0;i<p.count;i++){var x=p.getX(i),y=p.getY(i),z=p.getZ(i),f=1+.2*Math.sin(x*3.1+sd)*Math.cos(z*2.7+sd*2)+.16*Math.sin(y*4.3+sd*3)+.08*Math.sin((x+z)*7+sd)+.03*Math.sin((x-z)*17+y*11+sd);
    var X=x*f*1.15,Y=y*f*.7,Z=z*f,nx=X/1.3225,ny=Y/.49,nz=Z,l=Math.hypot(nx,ny,nz)||1;p.setXYZ(i,X,Y,Z);nm[i*3]=nx/l;nm[i*3+1]=ny/l;nm[i*3+2]=nz/l}
  g.setAttribute('normal',new THREE.BufferAttribute(nm,3));
  var r=rng(sd);return merge([{g:g,s:1,m:I4,c:function(y){return new THREE.Color().setHSL(.07+r()*.03,.05+r()*.05,.26+r()*.1+.05*y)}}])}
var rockG=[mkRock(3),mkRock(11),mkRock(29)];

// leaf atlas: 4x4 cells of 256px, drawn once at start (leaves, needles, fronds, grasses, flowers, vines)
var AT=document.createElement('canvas');AT.width=AT.height=1024;var ax=AT.getContext('2d'),ar=rng(1234);
function RR(a,b){return a+ar()*(b-a)}
function hsl(h,s,l,a){return 'hsla('+h+','+s+'%,'+l+'%,'+(a==null?1:a)+')'}
function cell(i,fn){ax.save();ax.translate((i&3)*256,(i>>2)*256);ax.beginPath();ax.rect(0,0,256,256);ax.clip();ax.lineCap='round';ax.lineJoin='round';fn(ax);ax.restore()}
function leaf(c,x,y,L,W,ang,h,s,l){c.save();c.translate(x,y);c.rotate(ang);
  var g=c.createLinearGradient(0,0,0,-L);g.addColorStop(0,hsl(h,s,l*.75));g.addColorStop(1,hsl(h+6,s,l*1.3));
  c.fillStyle=g;c.beginPath();c.moveTo(0,0);c.bezierCurveTo(W,-L*.22,W*.85,-L*.72,0,-L);c.bezierCurveTo(-W*.85,-L*.72,-W,-L*.22,0,0);c.fill();
  c.strokeStyle=hsl(h-4,s*.8,Math.min(80,l*1.7),.55);c.lineWidth=Math.max(.8,W*.07);c.beginPath();c.moveTo(0,0);c.lineTo(0,-L*.94);c.stroke();
  c.lineWidth=Math.max(.5,W*.035);c.beginPath();
  for(var k=1;k<=5;k++){var yy=-L*k/6.2,ex=W*.62*(1-k/7);c.moveTo(0,yy);c.lineTo(ex,yy-L*.12);c.moveTo(0,yy);c.lineTo(-ex,yy-L*.12)}
  c.stroke();c.restore()}
function cluster(c,n,hh,ss,ll,L0,L1,W0,W1){c.strokeStyle='#4a3a22';c.lineWidth=3;c.beginPath();c.moveTo(128,256);c.quadraticCurveTo(122,150,128,34);c.stroke();
  var ls=[];for(var i=0;i<n;i++){var y=RR(24,226),sp=26+100*Math.sin(Math.min(1,(y-14)/210)*3.14)*RR(.4,1),x=128+RR(-sp,sp);
    ls.push([x,y+22,RR(L0,L1),RR(W0,W1),(x-128)/100+RR(-.7,.7),RR(hh[0],hh[1]),RR(ss[0],ss[1]),RR(ll[0],ll[1])])}
  ls.sort(function(a,b){return a[1]-b[1]});ls.forEach(function(q){leaf(c,q[0],q[1],q[2],q[3],q[4],q[5],q[6],q[7])})}
function needles(c,x,y,ang,len,w){c.save();c.translate(x,y);c.rotate(ang);
  c.strokeStyle=hsl(25,35,22);c.lineWidth=w;c.beginPath();c.moveTo(0,0);c.lineTo(0,-len);c.stroke();
  for(var s=6;s<len;s+=3.2){var nl=Math.min(30,(len-s)*.7+6)*RR(.8,1.1);c.strokeStyle=hsl(RR(138,152),RR(38,50),RR(12,22));c.lineWidth=1.9;
    c.beginPath();c.moveTo(0,-s);c.lineTo(nl*.75,-s-nl*.7);c.moveTo(0,-s);c.lineTo(-nl*.75,-s-nl*.7);c.stroke()}
  c.restore()}

  for(var k=0;k<n;k++){var t=k/n,y=246-t*232,x=128+6*Math.sin(t*3.14),Lb=(Lmax*(1-t*.7)+6)*RR(.9,1.1);
    for(var sd=-1;sd<=1;sd+=2){var ex=x+sd*Lb*Math.sin(ang),ey=y-Lb*Math.cos(ang)*.95,hh=RR(h-8,h+8),ss=RR(45,62),ll=RR(20,38);
      if(fern){c.fillStyle=hsl(hh,ss,ll);c.beginPath();c.ellipse((x+ex)/2,(y+ey)/2,Lb*.5,Math.max(2.5,Lb*.14),Math.atan2(ey-y,ex-x),0,6.2832);c.fill()}
      else{c.strokeStyle=hsl(hh,ss,ll);c.lineWidth=RR(2.2,3.4);c.beginPath();c.moveTo(x,y);c.quadraticCurveTo((x+ex)/2,(y+ey)/2-Lb*.1,ex,ey+Lb*.12);c.stroke()}}}}
function blade(c,x,y,h,w,bend,hh,ss,ll){var g=c.createLinearGradient(0,y,0,y-h);g.addColorStop(0,hsl(hh,ss,ll*.55));g.addColorStop(1,hsl(hh-8,ss,ll*1.25));c.fillStyle=g;
  c.beginPath();c.moveTo(x-w/2,y);c.quadraticCurveTo(x-w*.35+bend*.3,y-h*.55,x+bend,y-h);c.quadraticCurveTo(x+w*.35+bend*.7,y-h*.5,x+w/2,y);c.fill()}
function stem(c,x0,y0,x1,y1,w){c.strokeStyle=hsl(100,45,28);c.lineWidth=w;c.beginPath();c.moveTo(x0,y0);c.quadraticCurveTo((x0+x1)/2+RR(-14,14),(y0+y1)/2,x1,y1);c.stroke()}

    c.ellipse(x+Math.cos(a)*r*.55,y+Math.sin(a)*r*.55,r*pw[0],r*pw[1],a,0,6.2832);c.fill()}
  c.fillStyle=cen;c.beginPath();c.arc(x,y,r*.28,0,6.2832);c.fill()}
function flowerCell(i,pos,fn){cell(i,function(c){pos.forEach(function(q){stem(c,128+RR(-10,10),254,q[0],q[1],3.5)});
  leaf(c,128,254,70,16,-.9,100,50,28);leaf(c,128,254,64,15,.9,104,50,30);leaf(c,128,254,52,13,.1,98,52,26);
  pos.forEach(function(q){fn(c,q[0],q[1],q[2])})})}
(function(){ax.fillStyle='rgba(70,100,45,.01)';ax.fillRect(0,0,1024,1024);
  cell(0,function(c){cluster(c,38,[88,112],[42,62],[22,38],46,74,18,28)});
  cell(1,function(c){c.strokeStyle='#3a2c18';c.lineWidth=4;c.beginPath();c.moveTo(128,256);c.lineTo(128,120);c.stroke();
    var ls=[];for(var i=0;i<8;i++){var x=128+RR(-60,60);ls.push([x,RR(200,250),RR(110,170),RR(34,50),(x-128)/90+RR(-.5,.5),RR(118,140),RR(45,62),RR(16,28)])}

addEventListener('pointerdown',audioInit);addEventListener('keydown',audioInit);
// ---------- input ----------
var keys={};

document.querySelectorAll('#pad button').forEach(function(b){

var locked=false,camPitch=0,cv=ren.domElement,canLock=!matchMedia('(pointer:coarse)').matches&&!!cv.requestPointerLock;
cv.addEventListener('pointerdown',function(){if(canLock&&!locked){try{cv.requestPointerLock()}catch(e){}}else if(!canLock)drag=true});

  document.getElementById('lockhint').style.display=locked||!canLock?'none':'block'});
addEventListener('pointermove',function(e){

  else if(drag)camOff=Math.max(-3.1,Math.min(3.1,camOff-e.movementX*.01))});

// ---------- physics ----------
function sm(t){t=Math.min(1,Math.max(0,t));return t*t*(3-2*t)}
function step(dt){
  var thr=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
  var st=(keys.KeyA||keys.ArrowLeft?1:0)-(keys.KeyD||keys.ArrowRight?1:0);
  var diff=keys.ShiftLeft||keys.ShiftRight,brake=keys.Space;
  if((thr||st||brake)&&auto)setAuto(false);
  if(auto){ // look ahead for the road centre, steer to it and cruise
    var sp0=Math.hypot(T.vx,T.vz),Ld=12+sp0*.9,best=1e9,ba=0,mm=mudAt(T.x,T.z);
    for(var q=-9;q<=9;q++){var an=T.h+q*.1,dd=Math.abs(roadD(T.x+Math.sin(an)*Ld,T.z+Math.cos(an)*Ld))+Math.abs(q)*.35;if(dd<best){best=dd;ba=q*.1}}
    st=Math.max(-1,Math.min(1,ba*2.2));
    var tv=(19-9*Math.abs(st))*(1-.6*mm);
    thr=Math.max(-1,Math.min(1,(tv-(T.vx*Math.sin(T.h)+T.vz*Math.cos(T.h)))*.4));
    diff=mm>.25}
  var sH=Math.sin(T.h),cH=Math.cos(T.h);
  var vf=T.vx*sH+T.vz*cH,vs=T.vx*cH-T.vz*sH,m=mudAt(T.x,T.z),ad=Math.abs(roadD(T.x,T.z)),pave=ad<4.6;
  // digging in: wheelspin in deep mud makes the truck sink, moving or leaving the mud lets it recover
  if(m>.4&&Math.abs(vf)<2.5&&thr)T.sink+=dt*m*(diff?.12:.22);else T.sink-=dt*(.15+Math.abs(vf)*.05)*(m<.3?2:.4);
  T.sink=Math.max(0,Math.min(1,T.sink));
  var trac=(1-m*(diff?.35:.6))*(1-.6*T.sink),grip=(pave?14:ad<10?8:6.5)*(1-m)*(1-.5*T.sink)+3*m;
  vf+=thr*(diff?18:14)*(pave?1.1:1)*trac*Math.max(.3,1-Math.abs(vf)/80)*dt;
  vf-=vf*((pave?.35:.65)+m*(diff?2.2:3.6)+T.sink*2.5)*dt;
  vs*=Math.exp(-dt*grip);
  if(brake)vf*=Math.exp(-dt*(pave?7:4));
  var dir=Math.abs(vf)>.3?Math.sign(vf):(thr||1);
  T.h+=st*1.2*Math.max(.15,Math.min(1,Math.abs(vf)/3))*dir*(1-.4*m)*dt;
  sH=Math.sin(T.h);cH=Math.cos(T.h);

  // slopes: gravity pulls when steeper than what tyres can hold
  var e=.8,gx=(H(T.x+e,T.z)-H(T.x-e,T.z))/(2*e),gz=(H(T.x,T.z+e)-H(T.x,T.z-e))/(2*e);

  var cx=Math.floor(T.x/S),cz=Math.floor(T.z/S);T.bumpT-=dt;
  for(var a=-1;a<=1;a++)for(var b=-1;b<=1;b++){var c=chunks.get((cx+a)+','+(cz+b));if(!c)continue;
    var list=c.col;
    for(var i=0;i<list.length;i++){var t=list[i],ox=t[0]-T.x,oz=t[1]-T.z;
      if(ox*ox+oz*oz>36)continue;
      var lx=ox*cH-oz*sH,lf=ox*sH+oz*cH,ex=lx-Math.max(-1.4,Math.min(1.4,lx)),ef=lf-Math.max(-2.5,Math.min(2.5,lf)),d=Math.hypot(ex,ef);

      var nx=(ex*cH+ef*sH)/d,nz=(-ex*sH+ef*cH)/d,ip=Math.hypot(T.vx,T.vz),pen=t[2]-d;

        if(vnn>0){T.vx-=nx*vnn*1.25;T.vz-=nz*vnn*1.25}T.vx*=.96;T.vz*=.96;
        T.vy+=Math.min(2.5,ip*.08);T.pv+=(Math.random()-.5)*ip*.06;T.rv+=(Math.random()-.5)*ip*.06}

  if(!pave&&spd>1&&Math.hypot(T.x-trLast.x,T.z-trLast.z)>.85){trLast.x=T.x;trLast.z=T.z;

      trI.setMatrixAt(trIdx%TN,trD);trI.setColorAt(trIdx%TN,trC.setRGB(.2-.1*ma,.14-.07*ma,.09-.05*ma));trIdx++}
    trI.instanceMatrix.needsUpdate=true;trI.instanceColor.needsUpdate=true}
  dirt=Math.max(0,Math.min(1,dirt+(m>.2?m*(Math.min(1,Math.abs(vf)/3)+.3)*dt*.12:-dt*.004)));

// ---------- loop ----------
(function(){var bd=1e9,bh=0,bs=-1;
